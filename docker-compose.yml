# Local infrastructure for cworkplace: MiniStack (AWS emulator: S3 + RDS Postgres), StackPort (UI) and coturn (TURN).
#   docker compose up -d        # then: bun --cwd apps/api run db:push && bun run dev
# The API is a single long-lived process (realtime state lives in memory), so no Redis is needed.
services:
  ministack:
    image: ministackorg/ministack:latest
    ports: ["4566:4566"]
    environment:
      - MINISTACK_REGION=us-east-1
      # keep resources and S3 objects in ~/.ministack across restarts
      - PERSIST_STATE=1
      - STATE_DIR=/var/lib/ministack/state
      - S3_PERSIST=1
      - S3_DATA_DIR=/var/lib/ministack/s3
      # RDS data lives in a named Docker volume so the database survives container respawns
      - RDS_PERSIST=1
    volumes:
      # RDS instances run as real Postgres containers started through the host's Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ministack:/var/lib/ministack

  # web UI for browsing the emulated AWS resources: http://localhost:8080
  stackport:
    image: davireis/stackport:latest
    ports: ["8080:8080"]
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_REGION=us-east-1
      # boto3 refuses to sign requests without credentials; MiniStack accepts any
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - STACKPORT_ALLOW_WRITES=true
    depends_on: [ministack]

  # creates the private bucket and the Postgres instance once
  ministack-init:
    image: amazon/aws-cli:2.27.0
    depends_on: [ministack]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://ministack:4566
    entrypoint: >
      /bin/sh -c "
      until aws s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
      aws s3api head-bucket --bucket cworkplace 2>/dev/null || aws s3api create-bucket --bucket cworkplace;
      aws rds describe-db-instances --db-instance-identifier cworkplace >/dev/null 2>&1 || aws rds create-db-instance --db-instance-identifier cworkplace --engine postgres --db-instance-class db.t3.micro --master-username cworkplace --master-user-password cworkplace --db-name cworkplace --allocated-storage 20;
      aws rds describe-db-instances --db-instance-identifier cworkplace --query 'DBInstances[0].Endpoint' --output text;
      "

  coturn:
    image: coturn/coturn:4.6
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --use-auth-secret --static-auth-secret=change-me-turn-secret
      --realm=cworkplace.local
      --min-port=49160 --max-port=49200
      --no-cli --fingerprint
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
