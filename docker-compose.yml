# Infrastructure for cworkplace: MiniStack (AWS emulator: S3 + RDS Postgres), StackPort (UI) and coturn (TURN).
#   docker compose up -d        # then: bun --cwd apps/api run db:push && bun run dev
# Values come from the root .env (written by setup.sh on servers); the defaults match local development.
# The API is a single long-lived process (realtime state lives in memory), so no Redis is needed.
name: cworkplace

services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: cworkplace-ministack
    restart: unless-stopped
    # loopback only: browsers reach S3 through Caddy at /s3/*
    ports: ["${BIND_ADDR:-127.0.0.1}:4566:4566"]
    environment:
      - MINISTACK_REGION=${S3_REGION:-us-east-1}
      # keep resources and S3 objects in ~/.ministack across restarts
      - PERSIST_STATE=1
      - STATE_DIR=/var/lib/ministack/state
      - S3_PERSIST=1
      - S3_DATA_DIR=/var/lib/ministack/s3
      # RDS data lives in a named Docker volume so the database survives container respawns
      - RDS_PERSIST=1
    volumes:
      # RDS instances run as real Postgres containers started through the host's Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ministack:/var/lib/ministack

  # web UI for browsing the emulated AWS resources: http://localhost:8080
  stackport:
    image: davireis/stackport:latest
    container_name: cworkplace-stackport
    restart: unless-stopped
    ports: ["${BIND_ADDR:-127.0.0.1}:8080:8080"]
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_REGION=${S3_REGION:-us-east-1}
      # boto3 refuses to sign requests without credentials; MiniStack accepts any
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-test}
      - STACKPORT_ALLOW_WRITES=true
    depends_on: [ministack]

  # creates the private bucket and the Postgres instance once; its last log line is the RDS port (read by setup.sh)
  ministack-init:
    image: amazon/aws-cli:2.27.0
    container_name: cworkplace-ministack-init
    depends_on: [ministack]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://ministack:4566
    # The RDS password only applies on creation; changing POSTGRES_PASSWORD later doesn't alter an existing instance.
    entrypoint: >
      /bin/sh -c "
      until aws s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
      aws s3api head-bucket --bucket ${S3_BUCKET:-cworkplace} 2>/dev/null || aws s3api create-bucket --bucket ${S3_BUCKET:-cworkplace};
      aws rds describe-db-instances --db-instance-identifier cworkplace >/dev/null 2>&1 || aws rds create-db-instance --db-instance-identifier cworkplace --engine postgres --db-instance-class db.t3.micro --master-username ${POSTGRES_USER:-cworkplace} --master-user-password ${POSTGRES_PASSWORD:-cworkplace} --db-name ${POSTGRES_DB:-cworkplace} --allocated-storage 20;
      aws rds describe-db-instances --db-instance-identifier cworkplace --query 'DBInstances[0].Endpoint.Port' --output text;
      "

  # Host networking: publishing the whole relay port range through docker-proxy is very slow, and coturn
  # must advertise the server's public IP (TURN_EXTERNAL_IP, written by setup.sh) in relay candidates.
  # Credentials stay time-limited (use-auth-secret): the API derives them from TURN_SECRET.
  coturn:
    image: coturn/coturn:4.6
    container_name: cworkplace-coturn
    restart: unless-stopped
    network_mode: host
    command: >
      -n --log-file=stdout
      --listening-ip=0.0.0.0
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      --listening-port=3478
      --min-port=${TURN_MIN_PORT:-49152} --max-port=${TURN_MAX_PORT:-65535}
      --fingerprint --lt-cred-mech
      --use-auth-secret --static-auth-secret=${TURN_SECRET:-change-me-turn-secret}
      --realm=${DOMAIN:-cworkplace.local}
      --no-cli --no-tls --no-dtls
