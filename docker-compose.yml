# Local infrastructure for cworkplace: Postgres, MinIO (S3) and coturn (TURN).
#   docker compose up -d        # then: bun --cwd apps/api run db:push && bun run dev
# The API is a single long-lived process (realtime state lives in memory), so no Redis is needed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cworkplace
      POSTGRES_PASSWORD: cworkplace
      POSTGRES_DB: cworkplace
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cworkplace"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cworkplace
      MINIO_ROOT_PASSWORD: cworkplace-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  # creates the private bucket once
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 cworkplace cworkplace-secret; do sleep 1; done;
      mc mb --ignore-existing local/cworkplace;
      mc anonymous set none local/cworkplace;
      "

  coturn:
    image: coturn/coturn:4.6
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --use-auth-secret --static-auth-secret=change-me-turn-secret
      --realm=cworkplace.local
      --min-port=49160 --max-port=49200
      --no-cli --fingerprint
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  postgres:
  minio:
