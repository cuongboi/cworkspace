name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # bumpp's own release commit must not re-trigger the workflow
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    environment: ACTIONS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bun run check-types
      - name: Build SPA + Linux binary
        run: bun run build # web build → apps/api/src/public, then bun --compile → ./run-server
      - name: Bump version, commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bunx bumpp package.json apps/api/package.json --release patch --yes \
            --commit "chore: release v%s" --tag "v%s" --push
          echo "VERSION=$(jq -r .version apps/api/package.json)" >> "$GITHUB_ENV"
          {
            echo "DESCRIPTION<<__DESCRIPTION_EOF__"
            jq -r .description package.json
            echo "__DESCRIPTION_EOF__"
          } >> "$GITHUB_ENV"
      - name: Package
        run: |
          mv run-server run-server-linux-x64
          tar -czf run-server-linux-x64.tar.gz run-server-linux-x64
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            run-server-linux-x64
            run-server-linux-x64.tar.gz
