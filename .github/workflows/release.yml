name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # bumpp's own release commit must not re-trigger the workflow
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    # DOCKERHUB_* are environment secrets: only visible to jobs that declare this environment
    environment: ACTIONS
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cworkplace
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile
      - name: Build SPA + Linux binary
        run: bun run build            # web build → apps/api/src/public, then bun --compile → ./run-server
      - name: Bump version, commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bunx bumpp package.json apps/api/package.json --release patch --yes \
            --commit "chore: release v%s" --tag "v%s" --push
          echo "VERSION=$(jq -r .version apps/api/package.json)" >> "$GITHUB_ENV"
          echo "DESCRIPTION=$(jq -r .description package.json)" >> "$GITHUB_ENV"
      - name: Package
        run: |
          mv run-server run-server-linux-x64
          tar -czf run-server-linux-x64.tar.gz run-server-linux-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            run-server-linux-x64
            run-server-linux-x64.tar.gz

      # Docker image: multi-stage build from source (Dockerfile), distroless runtime
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=cworkplace
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: ${{ env.DESCRIPTION }}
          readme-filepath: ./DOCKERHUB.md
